<!doctype html>
<html lang="uk">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com https://www.openstreetmap.org; base-uri 'self'; object-src 'none'" />
    <meta charset="utf-8" />
    <title>Благодійний фонд</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=uk/" />
    <link rel="canonical" href="https://ucare.foundation/uk/" />
    <link rel="alternate" hreflang="uk" href="https://ucare.foundation/uk/" />
    <link rel="alternate" hreflang="en" href="https://ucare.foundation/en/" />
    <link rel="alternate" hreflang="x-default" href="https://ucare.foundation/uk/" />
    <script>
      // Send an English-speaking visitor to /en/ without waiting for the refresh.
      (function () {
        try {
          var lang = (navigator.language || 'uk').toLowerCase();
          var target = lang.indexOf('uk') === 0 || lang.indexOf('ru') === 0 ? 'uk/' : 'en/';
          location.replace(target);
        } catch (e) {
          location.replace('uk/');
        }
      })();
    </script>
  </head>
  <body>
    <p>
      <a href="uk/">Українською</a> · <a href="en/">In English</a>
    </p>
  </body>
</html>
